server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # SPA 路由：所有路径回退到 index.html（Folia 是单页应用）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带哈希的静态资源长缓存
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML 不缓存，保证发新版立刻生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
